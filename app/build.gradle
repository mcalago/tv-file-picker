plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mcanalagoz.tvpicker'
    compileSdk 36

    defaultConfig {
        applicationId "com.mcanalagoz.tvpicker"
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName "0.9.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The release signing config is read from environment variables (the key file is not kept in the project):
    //   TVPICKER_KEYSTORE, TVPICKER_STORE_PASS, TVPICKER_KEY_ALIAS, TVPICKER_KEY_PASS
    // Without them the release APK is unsigned; the debug APK is always signed.
    signingConfigs {
        release {
            if (System.getenv("TVPICKER_KEYSTORE")) {
                storeFile file(System.getenv("TVPICKER_KEYSTORE"))
                storePassword System.getenv("TVPICKER_STORE_PASS")
                keyAlias System.getenv("TVPICKER_KEY_ALIAS")
                keyPassword System.getenv("TVPICKER_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("TVPICKER_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}
